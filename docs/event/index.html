<!doctype html>
<!--
  Tournament board: every court that has joined one event code, on one page.
  Link form: .../event/?h=<database host>&e=<event code>
  With &c=<court number> as well, the page lists the games that court has finished
  (boards/h-<code>-<court number>), each a link to that game's score and graph.
  A court that joins publishes its board to boards/e-<code>-<court number>, so this page needs no
  list: it simply asks for court 1 to 24 of that code and shows the ones that are in use.
  Without an event code (.../event/?h=<database host>) the page lists the tournaments that are
  running now, from boards/event-list, each one a link to its own board.
-->
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>대회 현황판</title>
<style>
html,body{margin:0;min-height:100%;background:#0E1116;color:#fff;font-family:sans-serif}
header{display:flex;align-items:baseline;gap:12px;padding:12px 16px 4px;flex-wrap:wrap}
h1{font-size:22px;margin:0}
#sub{color:#9AA4B2;font-size:14px}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;padding:12px 16px 24px}
.court{background:#171B22;border-radius:14px;padding:10px;text-decoration:none;color:#fff;display:block}
.court a{color:inherit;text-decoration:none}
a.no{text-decoration:underline;text-underline-offset:4px}
.last{color:#9AA4B2;font-size:14px;margin:6px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px}
.no{font-size:20px;font-weight:bold;color:#FFC53D}
.state{font-size:13px;color:#9AA4B2}
.state.live{color:#5DCAA5}
.sides{display:flex;gap:8px}
.side{flex:1;min-width:0;border-radius:10px;text-align:center;padding:8px 4px}
.name{font-size:16px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-size:64px;font-weight:bold;line-height:1.1}
.foot{color:#9AA4B2;font-size:13px;margin:8px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot.msg{color:#FFC53D;font-size:15px}
#empty{padding:40px 16px;color:#9AA4B2;font-size:18px;text-align:center}
#load{display:none;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:bold}
#load.busy{display:inline-block;background:#FFC53D;color:#111}#load.full{display:inline-block;background:#E24B4A;color:#fff}
#back{color:#9AA4B2;font-size:14px;text-decoration:none;display:none}
.event{font-size:30px;font-weight:bold;color:#FFC53D;margin:6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<header><a id="back">← 대회 목록</a><h1 id="title">대회 현황판</h1><span id="sub"></span><span id="load"></span></header>
<div id="grid"></div>
<div id="empty"></div>
<script>
var COURTS = 24, FRESH = 6 * 3600 * 1000, LISTED = 3600 * 1000;
// Judged by when the score last moved, not by the app being open: a court rests after RESTING,
// is taken off the board after GONE, and a finished match stays up for DONE.
var RESTING = 10 * 60000, GONE = 2 * 3600 * 1000, DONE = 30 * 60000;
var query = new URLSearchParams(location.search);
var host = query.get('h') || '', code = (query.get('e') || '').toLowerCase();
var boards = {}, live = {}, round = 0;
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function two(n) { return (n < 10 ? '0' : '') + n; }
function hhmm(ms) { var d = new Date(ms); return two(d.getHours()) + ':' + two(d.getMinutes()); }
function clock(ms) { var s = Math.floor(Math.max(0, ms) / 1000); return two(Math.floor(s / 60)) + ':' + two(s % 60); }
function draw() {
  var now = Date.now(), grid = document.getElementById('grid'), shown = 0;
  grid.textContent = '';
  live = {};
  for (var n = 1; n <= COURTS; n++) {
    var b = boards[n];
    // A slot left over from an earlier event with the same code is not part of this one.
    if (!b || !b.left || b.ended || !b.aliveAt || now - b.aliveAt > FRESH) continue;
    // Boards from an app that does not send "changedAt" yet count as changed at their last signal.
    var idle = now - (b.changedAt || b.aliveAt);
    if (idle > GONE || (b.message && b.endedAt && now - b.endedAt > DONE)) continue;
    shown++;
    live[n] = true;
    // The court's name leads to its past games; its score, to that court's own page.
    var card = el('div', 'court');
    var top = el('div', 'top'), quiet = now - b.aliveAt;
    var name = el('a', 'no', n + '번 코트 ›');
    name.href = '?h=' + host + '&e=' + encodeURIComponent(code) + '&c=' + n;
    top.appendChild(name);
    var resting = !b.message && quiet < 90000 && idle >= RESTING;
    if (resting) card.style.opacity = 0.55;
    top.appendChild(el('span', 'state' + (quiet < 90000 && !b.message && !resting ? ' live' : ''),
      b.message ? '경기 종료' : quiet >= 90000 ? '신호 없음 ' + Math.floor(quiet / 60000) + '분'
        : resting ? '쉬는 중 · ' + Math.floor(idle / 60000) + '분' : '진행 중'));
    card.appendChild(top);
    var sides = el('a', 'sides');
    sides.href = '../view/?h=' + host + '&b=' + encodeURIComponent('e-' + code + '-' + two(n));
    [b.left, b.right].forEach(function (s) {
      var side = el('div', 'side');
      side.style.background = s.color;
      side.appendChild(el('div', 'name', (s.serve ? '● ' : '') + s.name));
      side.appendChild(el('div', 'score', s.score));
      sides.appendChild(side);
    });
    card.appendChild(sides);
    var played = b.startedAt ? (b.endedAt || now) - b.startedAt : 0;
    card.appendChild(el('div', 'foot' + (b.message ? ' msg' : ''), b.message || ((b.info || '') + ' · ⏱ ' + clock(played))));
    // The game before this one, unless it is the very game still on the board.
    if (b.last && b.last.id !== b.id) {
      card.appendChild(el('div', 'last', '직전 경기 · ' + b.last.nameA + ' ' + b.last.score + ' ' + b.last.nameB +
        (b.last.endedAt ? ' · ' + hhmm(b.last.endedAt) + ' 종료' : '')));
    }
    grid.appendChild(card);
  }
  document.getElementById('empty').textContent = shown ? '' : '아직 참가한 코트가 없습니다. 점수판 앱의 메뉴 → 대회 모드에서 이 대회 코드로 참가하세요.';
  document.getElementById('sub').textContent = '코트 ' + shown + '개 · ' + two(new Date(now).getHours()) + ':' + two(new Date(now).getMinutes()) + ':' + two(new Date(now).getSeconds());
}
// Every request counts against the database's monthly allowance, so the page asks for as little
// as it can: the courts on the board often, all the other numbers only every few rounds (which
// is how soon a newly joined court appears), and nothing while the page is not on screen.
// PACE, by server load: [milliseconds between rounds, rounds between asking for every number].
var PACE = [[3000, 5], [6000, 5], [15000, 4]], LIST_PACE = [15000, 30000, 60000];
function poll() {
  if (document.hidden) return;
  var all = round++ % PACE[load][1] === 0;
  for (var n = 1; n <= COURTS; n++) (function (n) {
    if (!all && !live[n]) return;
    fetch('https://' + host + '/boards/' + encodeURIComponent('e-' + code + '-' + two(n)) + '.json', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (b) { boards[n] = b; })
      .catch(function () {});
  })(n);
}
// One court's past games, newest first: each the board as it stood when the game ended.
function drawHistory(games, court) {
  var grid = document.getElementById('grid'), list = [];
  for (var id in games || {}) if (games[id] && games[id].left) list.push([id, games[id]]);
  list.sort(function (x, y) { return (y[1].endedAt || 0) - (x[1].endedAt || 0); });
  grid.textContent = '';
  list.forEach(function (g) {
    var b = g[1], card = el('a', 'court');
    card.href = '../view/?h=' + host + '&b=' + encodeURIComponent('h-' + code + '-' + two(court)) + '&g=' + encodeURIComponent(g[0]);
    var top = el('div', 'top'), d = new Date(b.endedAt || b.aliveAt || 0);
    top.appendChild(el('span', 'no', (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hhmm(d.getTime()) + ' 종료'));
    top.appendChild(el('span', 'state', b.startedAt && b.endedAt ? '⏱ ' + clock(b.endedAt - b.startedAt) : ''));
    card.appendChild(top);
    var sides = el('div', 'sides');
    [b.left, b.right].forEach(function (s) {
      var side = el('div', 'side');
      side.style.background = s.color;
      side.appendChild(el('div', 'name', s.name));
      side.appendChild(el('div', 'score', s.score));
      sides.appendChild(side);
    });
    card.appendChild(sides);
    card.appendChild(el('div', 'foot msg', b.message || ''));
    grid.appendChild(card);
  });
  document.getElementById('empty').textContent = list.length ? '' : '이 코트에서 끝난 경기가 아직 없습니다.';
  document.getElementById('sub').textContent = '경기 ' + list.length + '건 · 눌러서 점수 내역 보기';
}
function pollHistory(court) {
  if (document.hidden) return;
  fetch('https://' + host + '/boards/' + encodeURIComponent('h-' + code + '-' + two(court)) + '/games.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (games) { drawHistory(games, court); })
    .catch(function () {});
}
// Without an event code: the tournaments that a court has refreshed within the last hour.
function drawList(doc) {
  // A tournament its organizer has ended is off the list, whatever a late court still sends.
  var list = (doc && doc.list) || {}, closed = (doc && doc.closed) || {};
  var now = Date.now(), grid = document.getElementById('grid'), codes = [];
  for (var c in list) if (/^[a-z0-9가-힣]{2,12}$/.test(c) && now - list[c] < LISTED && !closed[c]) codes.push(c);
  codes.sort(function (a, b) { return list[b] - list[a]; });
  grid.textContent = '';
  codes.forEach(function (c) {
    var card = el('a', 'court');
    card.href = '?h=' + host + '&e=' + encodeURIComponent(c);
    card.appendChild(el('div', 'event', '🏆 ' + c));
    card.appendChild(el('div', 'foot', '눌러서 코트별 점수 보기'));
    grid.appendChild(card);
  });
  document.getElementById('empty').textContent = codes.length ? '' : '지금 운영 중인 대회가 없습니다.';
  document.getElementById('sub').textContent = '대회 ' + codes.length + '개 · ' + two(new Date(now).getHours()) + ':' + two(new Date(now).getMinutes());
}
function pollList() {
  if (document.hidden) return;
  fetch('https://' + host + '/boards/event-list.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(drawList)
    .catch(function () {});
}
// Says "one screen is watching this" to boards/view-stats once a minute, so the administrator's
// page can count viewers against the database's limits. Only a random id for this tab and the
// time go there; the entry is taken back when the page is left.
var sid = Math.random().toString(36).slice(2, 10);
function presence(kind, target, on) {
  var body = { v: 1 };
  body[kind + '/' + target + '/' + sid] = on ? Date.now() : null;
  // A POST marked as PATCH: merged into the list, and needs no preflight request.
  fetch('https://' + host + '/boards/view-stats.json?print=silent&x-http-method-override=PATCH',
    { method: 'POST', body: JSON.stringify(body), keepalive: true }).catch(function () {});
}
// How busy the database is, worked out from the screens watching right now (boards/view-stats)
// the same way the app does: 0 normal, 1 busy, 2 very busy. The page says so in colour and asks
// less often as it rises. "force" is the administrator's override, for when the month's
// allowance is running out, which cannot be seen from here.
var load = 0, onLoadChange = null;
function loadLevel(stats, now) {
  stats = stats || {};
  function watching(kind) {
    var n = 0, targets = stats[kind] || {};
    for (var t in targets) for (var tab in targets[t]) if (now - targets[t][tab] < 150000) n++;
    return n;
  }
  var b = watching('b'), perHour = b * 0.2 + watching('l') * 0.1 + watching('e') * 10;
  var seen = (b >= 90 || perHour >= 500) ? 2 : (b >= 70 || perHour >= 150) ? 1 : 0;
  return Math.max(seen, Math.min(2, Math.max(0, stats.force | 0)));
}
function checkLoad() {
  if (document.hidden) return;
  fetch('https://' + host + '/boards/view-stats.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (stats) {
      var was = load, pill = document.getElementById('load');
      load = loadLevel(stats, Date.now());
      pill.className = ['', 'busy', 'full'][load];
      pill.textContent = ['', '서버 혼잡 · 갱신 간격을 늘렸습니다', '서버 매우 혼잡 · 갱신이 느려집니다'][load];
      if (was !== load && onLoadChange) onLoadChange();
    })
    .catch(function () {});
}
function watchLoad() {
  // Not all screens at the same moment.
  setTimeout(checkLoad, 2000 + Math.random() * 8000);
  setInterval(checkLoad, 300000);
}
// A screen counts while it is on screen, which is also when it asks the database for scores.
function watching(kind, target) {
  function beat() { if (!document.hidden) presence(kind, target, true); }
  beat();
  setInterval(beat, 60000);
  document.addEventListener('visibilitychange', function () { presence(kind, target, !document.hidden); });
  window.addEventListener('pagehide', function () { presence(kind, target, false); });
}
// Only ever talk to a Firebase database, whatever the link says.
var hostOk = /^[a-z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)$/.test(host);
if (hostOk && !code) {
  document.title = '운영 중인 대회';
  document.getElementById('title').textContent = '운영 중인 대회';
  (function again() { pollList(); setTimeout(again, LIST_PACE[load]); })();
  watchLoad();
  document.addEventListener('visibilitychange', pollList);
  watching('l', 'all');
} else if (!hostOk || !/^[a-z0-9가-힣]{2,12}$/.test(code)) {
  document.getElementById('empty').textContent = '링크가 올바르지 않습니다';
} else if (/^([1-9]|1[0-9]|2[0-4])$/.test(query.get('c') || '')) {
  var court = +query.get('c'), up = document.getElementById('back');
  up.href = '?h=' + host + '&e=' + encodeURIComponent(code);
  up.textContent = '← 대회 현황판';
  up.style.display = 'inline';
  document.title = code + ' · ' + court + '번 코트 지난 경기';
  document.getElementById('title').textContent = code + ' · ' + court + '번 코트 지난 경기';
  pollHistory(court);
  // A list of finished games changes when one more ends, which is not often.
  setInterval(function () { pollHistory(court); }, 60000);
  document.addEventListener('visibilitychange', function () { pollHistory(court); });
} else {
  var back = document.getElementById('back');
  back.href = '?h=' + host;
  back.style.display = 'inline';
  document.getElementById('title').textContent = '대회 현황판 · ' + code;
  (function again() { poll(); setTimeout(again, PACE[load][0]); })();
  // A tournament made with a number of courts has no others to ask about.
  fetch('https://' + host + '/boards/event-list/courts/' + encodeURIComponent(code) + '.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (n) { if (n >= 1 && n <= 24) COURTS = n; })
    .catch(function () {});
  watchLoad();
  setInterval(draw, 1000);
  // Back on screen: everything is asked for again at once.
  document.addEventListener('visibilitychange', function () { round = 0; poll(); });
  watching('e', code);
}
</script></body></html>
