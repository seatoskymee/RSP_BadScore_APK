<!doctype html>
<!--
  Viewer for internet score sharing. Static page: it reads one board from the Firebase Realtime
  Database named in the link and redraws whenever the scoring phone uploads a change.
  Link form: .../view/?h=<database host>&b=<board id>
-->
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>배드 스코어</title>
<style>
html,body{margin:0;height:100%;background:#0E1116;color:#fff;font-family:sans-serif;overflow:hidden}
#bar{display:flex;align-items:center;gap:3vw;height:6vh;padding:0 2vw;box-sizing:border-box}
#app,#snd{flex:none;white-space:nowrap;font-size:min(2.6vh,3.6vw);font-weight:bold;color:#FFC53D;text-decoration:none;background:none;border:0;padding:0;font-family:inherit;cursor:pointer}
#info{flex:1;min-width:0;color:#9AA4B2;font-size:min(3vh,3.4vw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#board{display:flex;height:62vh;gap:1vw;padding:0 1vw;box-sizing:border-box}
.side{flex:1;min-width:0;border-radius:2vh;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#171B22}
.name{font-size:5vh;font-weight:bold}
.court{display:flex;gap:1vw;margin:1vh 0;font-size:3vh;font-weight:bold}.court span{padding:.3vh 1.4vw;border-radius:1vh;background:rgba(0,0,0,.2)}.court .s{background:#FFC53D;color:#111}.court .r{outline:2px solid #fff}
.score{font-size:min(38vw,36vh);font-weight:bold;line-height:1}
.serve{position:absolute;top:1.5vh;left:2vw;color:#FFC53D;font-size:3vh;font-weight:bold}
.flag{color:#FFC53D;font-size:4vh;font-weight:bold;min-height:5vh}
#graph{display:block;width:98vw;height:22vh;margin:1vh 1vw 0;background:#171B22}
#note{height:3vh;line-height:3vh;text-align:center;font-size:2.2vh;color:#9AA4B2;white-space:nowrap}
#msg{height:5vh;line-height:5vh;text-align:center;font-size:3.8vh;color:#FFC53D;white-space:nowrap}
</style></head><body>
<div id="bar"><div id="info"></div>
<button id="snd" type="button">🔇 소리 켜기</button>
<a id="app" href="https://github.com/seatoskymee/RSP_BadScore_APK/releases/latest/download/RSP_BadScore.apk">⬇ 앱 내려받기</a></div>
<div id="board">
<div class="side" id="l"><div class="serve"></div><div class="name"></div><div class="court"></div><div class="score"></div><div class="flag"></div></div>
<div class="side" id="r"><div class="serve"></div><div class="name"></div><div class="court"></div><div class="score"></div><div class="flag"></div></div>
</div>
<canvas id="graph"></canvas>
<div id="msg"></div>
<div id="note"></div>
<script>
var board = null;
function el(id) { return document.getElementById(id); }
function clock(ms) {
  var s = Math.floor(Math.max(0, ms) / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  function two(n) { return (n < 10 ? '0' : '') + n; }
  return (h ? h + ':' : '') + two(m) + ':' + two(s % 60);
}
function court(e,s){var c=e.querySelector('.court');c.textContent='';if(!s.court)return;var pre=['좌 ','우 '];for(var i=0;i<2;i++){var p=s.court[i],x=document.createElement('span');x.className=p.role;x.textContent=(p.role=='s'?'● ':p.role=='r'?'◎ ':'')+pre[i]+p.name;c.appendChild(x);}}
function side(id, s) {
  var e = el(id);
  court(e, s);
  e.style.background = s.color;
  e.querySelector('.name').textContent = s.name;
  e.querySelector('.score').textContent = s.score;
  e.querySelector('.serve').textContent = (s.serve && !s.court) ? '● 서브' : '';
  e.querySelector('.flag').textContent = s.flag;
}
function graph(d){var c=document.getElementById('graph'),r=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
c.width=w*r;c.height=h*r;var g=c.getContext('2d');g.scale(r,r);g.clearRect(0,0,w,h);
var ra=d.rallies||'',n=ra.length,a=0,b=0,i;for(i=0;i<n;i++){if(ra.charAt(i)=='A')a++;else b++;}
var L=30,R=w-10,T=22,B=h-4,sh=(B-T)*0.14,sm=B-sh,cb=sm-sh-6;if(R<=L||cb<=T)return;
var slots=Math.max(n,Math.floor(d.target*3/2)),top=Math.max(d.target,a,b);
function x(i){return L+(R-L)*i/slots;}function y(p){return cb-(cb-T)*p/top;}
function seg(x1,y1,x2,y2){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();}
g.strokeStyle='rgba(255,255,255,0.2)';g.lineWidth=1;g.fillStyle='#9AA4B2';g.font='11px sans-serif';
seg(L,cb,R,cb);seg(L,y(d.target),R,y(d.target));g.fillText(d.target,4,y(d.target)+4);
g.setLineDash([4,4]);seg(L,y(d.mid),R,y(d.mid));g.setLineDash([]);g.fillText(d.mid,4,y(d.mid)+4);seg(L,sm,R,sm);
var bw=Math.max(1,(R-L)/slots*0.7);
for(i=0;i<n;i++){var cx=(x(i)+x(i+1))/2;if(ra.charAt(i)=='A'){g.fillStyle=d.colorA;g.fillRect(cx-bw/2,sm-sh,bw,sh);}else{g.fillStyle=d.colorB;g.fillRect(cx-bw/2,sm,bw,sh);}}
function run(t,col){var p=0;g.beginPath();g.moveTo(x(0),y(0));for(var k=0;k<n;k++){if(ra.charAt(k)==t)p++;g.lineTo(x(k+1),y(p));}
g.strokeStyle=col;g.lineWidth=2.5;g.lineJoin='round';g.stroke();g.fillStyle=col;g.beginPath();g.arc(x(n),y(p),4,0,6.3);g.fill();}
run('A',d.colorA);run('B',d.colorB);
var tx=L,items=[[d.colorA,d.nameA+' '+a],[d.colorB,d.nameB+' '+b]];
for(i=0;i<2;i++){g.fillStyle=items[i][0];g.fillRect(tx,6,10,10);tx+=14;g.fillStyle='#9AA4B2';g.fillText(items[i][1],tx,15);tx+=g.measureText(items[i][1]).width+16;}}var sound=false,lastSaid=null;
function say(t){if(!sound||!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';speechSynthesis.speak(u);}
function callout(d){if(d.message)return d.message.replace(/(\d+):(\d+)/,function(m,a,b){return a+' 대 '+b+',';});
var l=d.left,r=d.right,a=r.serve?r.score:l.score,b=r.serve?l.score:r.score;return(a==b&&a>0)?a+' 올':a+' 대 '+b;}
function announce(d){var now=callout(d);if(lastSaid!==null&&now!==lastSaid&&!d.ended)say(now);lastSaid=now;}
function soundButton(){var b=document.getElementById('snd');if(!window.speechSynthesis){b.style.display='none';return;}
b.onclick=function(){sound=!sound;b.textContent=sound?'🔊 소리 켜짐':'🔇 소리 켜기';if(sound)say('점수 음성 안내를 켰습니다');else speechSynthesis.cancel();};}function draw() {
  if (!board) return;
  // A closed board stops its clock where the phone last reported in.
  var until = board.endedAt || (board.ended && board.aliveAt ? board.aliveAt : Date.now());
  var played = board.startedAt ? until - board.startedAt : 0;
  var quiet = board.aliveAt ? Date.now() - board.aliveAt : 0, note = '';
  if (board.ended) {
    note = '점수 공유가 종료되었습니다 (점수판 앱을 닫음)';
  } else if (quiet > 90000) {
    note = '점수판 앱이 화면에 떠 있지 않습니다 · 마지막 신호 ' + Math.floor(quiet / 60000) + '분 전';
  }
  el('note').textContent = note;
  el('board').style.opacity = board.ended ? 0.45 : 1;
  el('info').textContent = board.info + ' · ⏱ ' + clock(played);
  side('l', board.left);
  side('r', board.right);
  graph(board);
  if (board.app) el('app').href = board.app;
  el('msg').textContent = board.message || '';
}
soundButton();
var query = new URLSearchParams(location.search);
var host = query.get('h') || '', id = query.get('b') || '';
// Only ever talk to a Firebase database, whatever the link says.
var hostOk = /^[a-z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)$/.test(host);
if (!hostOk || !/^[a-z0-9]{6,24}$/.test(id)) {
  el('msg').textContent = '링크가 올바르지 않습니다';
} else {
  var source = new EventSource('https://' + host + '/boards/' + id + '.json');
  source.addEventListener('put', function (e) {
    var change = JSON.parse(e.data);
    if (change.path === '/') { board = change.data; }
    if (!board) { el('msg').textContent = '아직 공유된 점수가 없습니다'; } else { draw(); announce(board); }
  });
  source.onerror = function () { el('msg').textContent = '연결 중…'; };
  setInterval(draw, 1000);
}
</script></body></html>
