<!doctype html>
<!--
  Viewer for internet score sharing. Static page: it reads one board from the Firebase Realtime
  Database named in the link and redraws whenever the scoring phone uploads a change.
  Link form: .../view/?h=<database host>&b=<board id>
-->
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>배드 스코어</title>
<style>
html,body{margin:0;height:100%;background:#0E1116;color:#fff;font-family:sans-serif;overflow:hidden}
#info{height:6vh;line-height:6vh;padding:0 2vw;color:#9AA4B2;font-size:3vh;white-space:nowrap;overflow:hidden}
#board{display:flex;height:84vh;gap:1vw;padding:0 1vw;box-sizing:border-box}
.side{flex:1;min-width:0;border-radius:2vh;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#171B22}
.name{font-size:5vh;font-weight:bold}
.score{font-size:min(38vw,60vh);font-weight:bold;line-height:1}
.serve{position:absolute;top:1.5vh;left:2vw;color:#FFC53D;font-size:3vh;font-weight:bold}
.flag{color:#FFC53D;font-size:4vh;font-weight:bold;min-height:5vh}
#msg{height:10vh;line-height:10vh;text-align:center;font-size:4.5vh;color:#FFC53D;white-space:nowrap}
</style></head><body>
<div id="info"></div>
<div id="board">
<div class="side" id="l"><div class="serve"></div><div class="name"></div><div class="score"></div><div class="flag"></div></div>
<div class="side" id="r"><div class="serve"></div><div class="name"></div><div class="score"></div><div class="flag"></div></div>
</div>
<div id="msg"></div>
<script>
var board = null;
function el(id) { return document.getElementById(id); }
function clock(ms) {
  var s = Math.floor(Math.max(0, ms) / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  function two(n) { return (n < 10 ? '0' : '') + n; }
  return (h ? h + ':' : '') + two(m) + ':' + two(s % 60);
}
function side(id, s) {
  var e = el(id);
  e.style.background = s.color;
  e.querySelector('.name').textContent = s.name;
  e.querySelector('.score').textContent = s.score;
  e.querySelector('.serve').textContent = s.serve ? '● 서브' : '';
  e.querySelector('.flag').textContent = s.flag;
}
function draw() {
  if (!board) return;
  var played = board.startedAt ? (board.endedAt || Date.now()) - board.startedAt : 0;
  el('info').textContent = board.info + ' · ⏱ ' + clock(played);
  side('l', board.left);
  side('r', board.right);
  el('msg').textContent = board.message || '';
}
var query = new URLSearchParams(location.search);
var host = query.get('h') || '', id = query.get('b') || '';
// Only ever talk to a Firebase database, whatever the link says.
var hostOk = /^[a-z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)$/.test(host);
if (!hostOk || !/^[a-z0-9]{6,24}$/.test(id)) {
  el('msg').textContent = '링크가 올바르지 않습니다';
} else {
  var source = new EventSource('https://' + host + '/boards/' + id + '.json');
  source.addEventListener('put', function (e) {
    var change = JSON.parse(e.data);
    if (change.path === '/') { board = change.data; }
    if (!board) { el('msg').textContent = '아직 공유된 점수가 없습니다'; } else { draw(); }
  });
  source.onerror = function () { el('msg').textContent = '연결 중…'; };
  setInterval(draw, 1000);
}
</script></body></html>
