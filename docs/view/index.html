<!doctype html>
<!--
  Viewer for internet score sharing. Static page: it reads one board from the Firebase Realtime
  Database named in the link and redraws whenever the scoring phone uploads a change.
  Link form: .../view/?h=<database host>&b=<board id>
-->
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>배드 스코어</title>
<style>
html,body{margin:0;height:100%;background:#0E1116;color:#fff;font-family:sans-serif;overflow:hidden}
#info{height:6vh;line-height:6vh;padding:0 2vw;color:#9AA4B2;font-size:3vh;white-space:nowrap;overflow:hidden}
#board{display:flex;height:62vh;gap:1vw;padding:0 1vw;box-sizing:border-box}
.side{flex:1;min-width:0;border-radius:2vh;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#171B22}
.name{font-size:5vh;font-weight:bold}
.score{font-size:min(38vw,42vh);font-weight:bold;line-height:1}
.serve{position:absolute;top:1.5vh;left:2vw;color:#FFC53D;font-size:3vh;font-weight:bold}
.flag{color:#FFC53D;font-size:4vh;font-weight:bold;min-height:5vh}
#graph{display:block;width:98vw;height:22vh;margin:1vh 1vw 0;background:#171B22}
#msg{height:8vh;line-height:8vh;text-align:center;font-size:4.5vh;color:#FFC53D;white-space:nowrap}
</style></head><body>
<div id="info"></div>
<div id="board">
<div class="side" id="l"><div class="serve"></div><div class="name"></div><div class="score"></div><div class="flag"></div></div>
<div class="side" id="r"><div class="serve"></div><div class="name"></div><div class="score"></div><div class="flag"></div></div>
</div>
<canvas id="graph"></canvas>
<div id="msg"></div>
<script>
var board = null;
function el(id) { return document.getElementById(id); }
function clock(ms) {
  var s = Math.floor(Math.max(0, ms) / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  function two(n) { return (n < 10 ? '0' : '') + n; }
  return (h ? h + ':' : '') + two(m) + ':' + two(s % 60);
}
function side(id, s) {
  var e = el(id);
  e.style.background = s.color;
  e.querySelector('.name').textContent = s.name;
  e.querySelector('.score').textContent = s.score;
  e.querySelector('.serve').textContent = s.serve ? '● 서브' : '';
  e.querySelector('.flag').textContent = s.flag;
}
function graph(d){var c=document.getElementById('graph'),r=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
c.width=w*r;c.height=h*r;var g=c.getContext('2d');g.scale(r,r);g.clearRect(0,0,w,h);
var ra=d.rallies||'',n=ra.length,a=0,b=0,i;for(i=0;i<n;i++){if(ra.charAt(i)=='A')a++;else b++;}
var L=30,R=w-10,T=22,B=h-4,sh=(B-T)*0.14,sm=B-sh,cb=sm-sh-6;if(R<=L||cb<=T)return;
var slots=Math.max(n,Math.floor(d.target*3/2)),top=Math.max(d.target,a,b);
function x(i){return L+(R-L)*i/slots;}function y(p){return cb-(cb-T)*p/top;}
function seg(x1,y1,x2,y2){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();}
g.strokeStyle='rgba(255,255,255,0.2)';g.lineWidth=1;g.fillStyle='#9AA4B2';g.font='11px sans-serif';
seg(L,cb,R,cb);seg(L,y(d.target),R,y(d.target));g.fillText(d.target,4,y(d.target)+4);
g.setLineDash([4,4]);seg(L,y(d.mid),R,y(d.mid));g.setLineDash([]);g.fillText(d.mid,4,y(d.mid)+4);seg(L,sm,R,sm);
var bw=Math.max(1,(R-L)/slots*0.7);
for(i=0;i<n;i++){var cx=(x(i)+x(i+1))/2;if(ra.charAt(i)=='A'){g.fillStyle=d.colorA;g.fillRect(cx-bw/2,sm-sh,bw,sh);}else{g.fillStyle=d.colorB;g.fillRect(cx-bw/2,sm,bw,sh);}}
function run(t,col){var p=0;g.beginPath();g.moveTo(x(0),y(0));for(var k=0;k<n;k++){if(ra.charAt(k)==t)p++;g.lineTo(x(k+1),y(p));}
g.strokeStyle=col;g.lineWidth=2.5;g.lineJoin='round';g.stroke();g.fillStyle=col;g.beginPath();g.arc(x(n),y(p),4,0,6.3);g.fill();}
run('A',d.colorA);run('B',d.colorB);
var tx=L,items=[[d.colorA,d.nameA+' '+a],[d.colorB,d.nameB+' '+b]];
for(i=0;i<2;i++){g.fillStyle=items[i][0];g.fillRect(tx,6,10,10);tx+=14;g.fillStyle='#9AA4B2';g.fillText(items[i][1],tx,15);tx+=g.measureText(items[i][1]).width+16;}}function draw() {
  if (!board) return;
  var played = board.startedAt ? (board.endedAt || Date.now()) - board.startedAt : 0;
  el('info').textContent = board.info + ' · ⏱ ' + clock(played);
  side('l', board.left);
  side('r', board.right);
  graph(board);
  el('msg').textContent = board.message || '';
}
var query = new URLSearchParams(location.search);
var host = query.get('h') || '', id = query.get('b') || '';
// Only ever talk to a Firebase database, whatever the link says.
var hostOk = /^[a-z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)$/.test(host);
if (!hostOk || !/^[a-z0-9]{6,24}$/.test(id)) {
  el('msg').textContent = '링크가 올바르지 않습니다';
} else {
  var source = new EventSource('https://' + host + '/boards/' + id + '.json');
  source.addEventListener('put', function (e) {
    var change = JSON.parse(e.data);
    if (change.path === '/') { board = change.data; }
    if (!board) { el('msg').textContent = '아직 공유된 점수가 없습니다'; } else { draw(); }
  });
  source.onerror = function () { el('msg').textContent = '연결 중…'; };
  setInterval(draw, 1000);
}
</script></body></html>
